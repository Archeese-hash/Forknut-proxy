<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050509"
  >

  <title>Forknut Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: #050509;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* =========================
       MOVING BACKGROUND
       ========================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          circle at 50% 20%,
          #171727 0%,
          #09090f 45%,
          #050509 100%
        );
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.035);
      filter: blur(1px);
      animation:
        floatBubble 18s infinite ease-in-out;
    }

    .bubble:nth-child(1) {
      width: 180px;
      height: 180px;
      left: 5%;
      top: 20%;
      animation-delay: -2s;
    }

    .bubble:nth-child(2) {
      width: 260px;
      height: 260px;
      right: 5%;
      top: 10%;
      animation-delay: -7s;
    }

    .bubble:nth-child(3) {
      width: 140px;
      height: 140px;
      left: 35%;
      bottom: 5%;
      animation-delay: -12s;
    }

    .bubble:nth-child(4) {
      width: 220px;
      height: 220px;
      right: 25%;
      bottom: 15%;
      animation-delay: -4s;
    }

    @keyframes floatBubble {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(
          35px,
          -45px,
          0
        ) scale(1.08);
      }

      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* =========================
       APP
       ========================= */

    #app {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* =========================
       TOP BAR
       ========================= */

    .topbar {
      flex: 0 0 auto;

      width: 100%;

      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        10px;

      background: rgba(5, 5, 9, 0.88);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom:
        1px solid rgba(255, 255, 255, 0.08);

      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 9px;

      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin-left: 20px;

      margin-top: -6px;
      margin-bottom: 10px;

      color: rgba(255, 255, 255, 0.45);

      font-size: 11px;
    }

    /* =========================
       SEARCH
       ========================= */

    .search {
      display: flex;
      width: 100%;
      gap: 7px;
    }

    .search input {
      min-width: 0;
      flex: 1;

      height: 42px;

      border: 1px solid
        rgba(255, 255, 255, 0.12);

      border-radius: 13px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.07);

      color: white;

      padding:
        0 13px;

      font-size: 15px;

      -webkit-appearance: none;
    }

    .search input::placeholder {
      color:
        rgba(255, 255, 255, 0.38);
    }

    .search input:focus {
      border-color:
        rgba(255, 255, 255, 0.28);

      background:
        rgba(255, 255, 255, 0.09);
    }

    .search button {
      flex: 0 0 auto;

      height: 42px;

      padding:
        0 16px;

      border: 0;

      border-radius: 13px;

      background: white;

      color: #050509;

      font-size: 14px;
      font-weight: 750;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }

    /* =========================
       TABS
       ========================= */

    .tabs-row {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-top: 9px;

      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;
    }

    .tabs-row::-webkit-scrollbar {
      display: none;
    }

    #tabs {
      display: flex;
      align-items: center;

      gap: 6px;

      min-width: 0;

      flex: 1;

      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;
    }

    #tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;

      display: flex;
      align-items: center;

      min-width: 105px;
      max-width: 190px;

      height: 34px;

      padding:
        0 7px
        0 12px;

      gap: 8px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.045);

      border:
        1px solid
        rgba(255, 255, 255, 0.07);

      color:
        rgba(255, 255, 255, 0.52);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }

    .tab.active {
      background:
        rgba(255, 255, 255, 0.11);

      color: white;

      border-color:
        rgba(255, 255, 255, 0.15);
    }

    .tab-title {
      min-width: 0;
      flex: 1;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 12px;
      font-weight: 650;
    }

    .tab-close {
      width: 25px;
      height: 25px;

      padding: 0;

      border: 0;
      border-radius: 7px;

      background:
        transparent;

      color:
        rgba(255, 255, 255, 0.48);

      font-size: 18px;
      line-height: 25px;

      cursor: pointer;
    }

    .tab-close:active {
      background:
        rgba(255, 255, 255, 0.1);

      color: white;
    }

    #newTabButton {
      flex: 0 0 auto;

      width: 34px;
      height: 34px;

      border: 1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.055);

      color: white;

      font-size: 21px;

      cursor: pointer;
    }

    /* =========================
       CONTENT
       ========================= */

    #content {
      position: relative;

      flex: 1 1 auto;

      min-height: 0;

      overflow: hidden;
    }

    /* =========================
       HOME
       ========================= */

    #shell {
      position: absolute;
      inset: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        25px
        16px
        calc(35px + env(safe-area-inset-bottom));

      -webkit-overflow-scrolling: touch;

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
    }

    #shell.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .hero {
      width: min(700px, 100%);

      margin:
        18px auto
        28px;

      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;

      font-size:
        clamp(30px, 8vw, 48px);

      letter-spacing: -1.5px;
    }

    .hero p {
      margin: 0 auto;

      max-width: 540px;

      color:
        rgba(255, 255, 255, 0.52);

      line-height: 1.55;

      font-size: 14px;
    }

    .quick-buttons {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;

      width: min(700px, 100%);

      margin:
        0 auto
        22px;
    }

    .quick-button {
      min-height: 48px;

      border: 1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 14px;

      background:
        rgba(255, 255, 255, 0.055);

      color: white;

      font-weight: 700;

      cursor: pointer;
    }

    .quick-button:active {
      transform: scale(0.98);

      background:
        rgba(255, 255, 255, 0.11);
    }

    .games-title {
      width: min(700px, 100%);

      margin:
        28px auto 12px;

      font-size: 17px;
      font-weight: 800;
    }

    #gamesSection {
      width: min(700px, 100%);

      margin: 0 auto;
    }

    .games {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;
    }

    .game-card {
      min-height: 82px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 15px;

      border-radius: 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      background:
        rgba(255, 255, 255, 0.045);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }

    .game-card:active {
      transform: scale(0.98);

      background:
        rgba(255, 255, 255, 0.09);
    }

    .game-name {
      font-size: 15px;
      font-weight: 800;
    }

    .game-url {
      margin-top: 5px;

      color:
        rgba(255, 255, 255, 0.38);

      font-size: 11px;
    }

    /* =========================
       BROWSER
       ========================= */

    #browser {
      position: absolute;

      inset: 0;

      display: none;

      overflow: hidden;

      background: #fff;

      /*
       * Important:
       * The iframe is isolated from the dark UI.
       * This prevents the parent background from making
       * transparent iframe areas look like black media.
       */
      isolation: isolate;

      contain: strict;

      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    #browser.active {
      display: block;
    }

    /*
     * Proxy iframe
     *
     * Do NOT use opacity.
     * Do NOT use mix-blend-mode.
     * Do NOT use filters.
     * Do NOT use background transparency.
     *
     * These can cause compositing problems on iPad/Safari/WebKit.
     */
    .proxy-frame {
      position: absolute;

      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      min-width: 100%;
      min-height: 100%;

      border: 0;

      margin: 0;
      padding: 0;

      background: white;

      opacity: 1;

      visibility: visible;

      transform:
        translate3d(0, 0, 0);

      -webkit-transform:
        translate3d(0, 0, 0);

      backface-visibility: visible;
      -webkit-backface-visibility: visible;

      filter: none;

      mix-blend-mode: normal;

      color-scheme: light;

      /*
       * The iframe itself must be allowed to create
       * a normal browser compositing layer.
       */
      will-change: auto;

      z-index: 1;
    }

    /*
     * YouTube frame
     */
    .youtube-frame {
      position: absolute;

      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      min-width: 100%;
      min-height: 100%;

      border: 0;

      margin: 0;
      padding: 0;

      background: #000;

      opacity: 1;

      visibility: visible;

      transform:
        translate3d(0, 0, 0);

      -webkit-transform:
        translate3d(0, 0, 0);

      filter: none;

      mix-blend-mode: normal;

      z-index: 2;
    }

    /*
     * This makes sure browser frames never accidentally
     * inherit the app's dark visual effects.
     */
    #browser iframe {
      color-scheme: light;
    }

    /* =========================
       HOME BUTTON
       ========================= */

    #homeButton {
      position: absolute;

      left: 12px;
      bottom:
        calc(12px + env(safe-area-inset-bottom));

      z-index: 30;

      display: none;

      height: 40px;

      padding:
        0 15px;

      border: 1px solid
        rgba(0, 0, 0, 0.15);

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.92);

      color: #050509;

      font-weight: 750;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.2);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }

    #homeButton.visible {
      display: block;
    }

    /* =========================
       STATUS
       ========================= */

    #status {
      position: fixed;

      left: 50%;

      bottom:
        calc(6px + env(safe-area-inset-bottom));

      transform:
        translateX(-50%);

      z-index: 100;

      max-width: 72vw;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      color:
        rgba(255, 255, 255, 0.32);

      font-size: 10px;

      pointer-events: none;
    }

    /* =========================
       IPAD / LARGE SCREENS
       ========================= */

    @media (min-width: 700px) {

      .topbar {
        padding-left: 18px;
        padding-right: 18px;
      }

      .search {
        max-width: 1000px;
        margin: 0 auto;
      }

      .tabs-row {
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
      }

      .subtitle {
        text-align: center;
        margin-left: 0;
      }
    }

    /* =========================
       SMALL SCREENS
       ========================= */

    @media (max-width: 430px) {

      .quick-buttons {
        grid-template-columns:
          1fr 1fr;
      }

      .games {
        grid-template-columns:
          1fr 1fr;
      }

      .hero {
        margin-top: 8px;
      }

      .hero h1 {
        font-size: 34px;
      }
    }

    /*
     * When the iPad keyboard opens, don't allow the app
     * to accidentally scroll the whole document.
     */
    @supports (-webkit-touch-callout: none) {

      input,
      button {
        -webkit-touch-callout: none;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <div id="app">

    <!-- =====================
         TOP BAR
         ===================== -->

    <header class="topbar">

      <div class="brand">
        <span class="brand-dot"></span>
        <span>Forknut Proxy</span>
      </div>

      <div class="subtitle">
        Made by Archie Faulkner
      </div>

      <form
        id="proxyForm"
        class="search"
        autocomplete="off"
      >

        <input
          id="url"
          type="text"
          inputmode="url"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="Enter a website or search..."
          aria-label="Website or search"
        >

        <button
          type="submit"
        >
          Go
        </button>

      </form>

      <div class="tabs-row">

        <div id="tabs"></div>

        <button
          id="newTabButton"
          type="button"
          aria-label="New tab"
          title="New tab"
        >
          +
        </button>

      </div>

    </header>


    <!-- =====================
         MAIN CONTENT
         ===================== -->

    <main id="content">

      <!-- HOME -->

      <section id="shell">

        <div class="hero">

          <h1>
            Forknut
          </h1>

          <p>
            Browse the web through Forknut Proxy.
            Enter a URL above or use one of the
            shortcuts below.
          </p>

        </div>


        <div class="quick-buttons">

          <button
            id="pointercrateButton"
            class="quick-button"
            type="button"
          >
            Pointercrate
          </button>

          <button
            id="gamesButton"
            class="quick-button"
            type="button"
          >
            Games
          </button>

        </div>


        <div class="games-title">
          Games
        </div>


        <div id="gamesSection">

          <div class="games">

            <div
              class="game-card"
              data-game="https://geometrydash.io/"
            >
              <div class="game-name">
                Geometry Dash
              </div>

              <div class="game-url">
                geometrydash.io
              </div>
            </div>


            <div
              class="game-card"
              data-game="https://shellshock.io/"
            >
              <div class="game-name">
                Shell Shockers
              </div>

              <div class="game-url">
                shellshock.io
              </div>
            </div>


            <div
              class="game-card"
              data-game="https://krunker.io/"
            >
              <div class="game-name">
                Krunker
              </div>

              <div class="game-url">
                krunker.io
              </div>
            </div>


            <div
              class="game-card"
              data-game="https://1v1.lol/"
            >
              <div class="game-name">
                1v1.LOL
              </div>

              <div class="game-url">
                1v1.lol
              </div>
            </div>

          </div>

        </div>

      </section>


      <!-- =====================
           BROWSER VIEW
           ===================== -->

      <section
        id="browser"
        aria-label="Forknut browser"
      >
      </section>

      <button
        id="homeButton"
        type="button"
      >
        ← Home
      </button>

    </main>

  </div>


  <div id="status">
    Starting...
  </div>


  <!-- =====================
       SCRAMJET CONTROLLER
       ===================== -->

  <script
    src="/controller/controller.main.js"
  ></script>


  <!-- =====================
       SCRAMJET UTILS
       ===================== -->

  <script
    src="/utils/index.js"
  ></script>


  <!-- =====================
       FORKNUT APP
       ===================== -->

  <script
    src="/app.js"
    defer
  ></script>

</body>
</html>
