<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forknut Proxy</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0b1020;color:#f7f8ff;min-height:100vh;display:grid;place-items:center}
.wrap{width:min(760px,92vw);text-align:center}.logo{font-size:20px;font-weight:800;letter-spacing:.5px;margin-bottom:55px}.logo span{display:inline-block;background:#6d5dfc;padding:8px 10px;border-radius:10px;margin-right:8px}
h1{font-size:clamp(38px,7vw,68px);margin:0 0 16px;line-height:1.02}p{color:#aeb6cf;font-size:18px;margin:0 auto 34px;max-width:600px}
form{display:flex;background:#151c31;border:1px solid #2b3552;border-radius:16px;padding:7px;box-shadow:0 18px 60px #0006}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:15px}button{border:0;border-radius:11px;padding:0 24px;background:#6d5dfc;color:white;font-weight:750;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.08)}.note{font-size:13px;color:#77819d;margin-top:18px}.note strong{display:block;font-size:20px;color:#aeb6cf;margin-bottom:6px}
</style>
</head>
<body>
<main class="wrap">
<div class="logo"><span>✦</span>Forknut Proxy</div>
<h1>Browse the web simply.</h1>
<p>Enter a website address below.</p>
<form id="proxyForm">
<input id="url" type="text" placeholder="https://example.com" autocomplete="off" required>
<button type="submit">Go</button>
</form>
<div class="note"><strong>Made by Archie Faulkner</strong>Forknut Proxy</div>
</main>

<script>
document.getElementById("proxyForm").addEventListener("submit", e => {
  e.preventDefault();
  let url = document.getElementById("url").value.trim();

  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }

  window.location.href = "/proxy?url=" + encodeURIComponent(url);
});
</script>

</body>
</html>
