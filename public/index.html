<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Forknut Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #09070d;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Browser tab bar */

    #tabBar {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      background: #15121b;
      border-bottom: 1px solid #30283b;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 100%;
      min-width: 0;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tab {
      height: 38px;
      min-width: 145px;
      max-width: 230px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 12px;
      border-radius: 10px;
      background: #211c29;
      color: #aaa2b5;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .tab.active {
      background: #30263c;
      color: white;
    }

    .tab-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .tab-close {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #aaa2b5;
      font-size: 18px;
      cursor: pointer;
    }

    .tab-close:hover {
      background: #453650;
      color: white;
    }

    #newTabButton {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 0;
      border-radius: 9px;
      background: #30263c;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    #newTabButton:hover {
      background: #4d3b60;
    }

    /* Main area */

    #main {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    /* Home screen */

    #shell {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 30px 18px;
      background:
        radial-gradient(
          circle at top,
          #241631 0%,
          #0d0912 45%,
          #09070d 100%
        );
    }

    #shell.hidden {
      display: none;
    }

    .home {
      max-width: 850px;
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      margin-top: 35px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa0b5;
      margin-bottom: 28px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      max-width: 700px;
      margin: 0 auto 25px;
    }

    #url {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: 1px solid #40364c;
      border-radius: 12px;
      outline: none;
      padding: 0 16px;
      background: #17131d;
      color: white;
      font-size: 16px;
    }

    #url:focus {
      border-color: #8b5fc7;
    }

    #proxyForm button {
      height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #7545a8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #proxyForm button:hover {
      background: #8c5cc0;
    }

    #status {
      min-height: 20px;
      color: #aaa0b5;
      font-size: 13px;
      margin-bottom: 25px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Side buttons */

    .side-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .side-button {
      border: 1px solid #40364c;
      background: #17131d;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .side-button:hover {
      background: #2a2034;
    }

    /* Games */

    .section-title {
      margin: 25px 0 14px;
      font-size: 22px;
    }

    .games {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .game-card {
      border: 1px solid #30283b;
      background: #15121b;
      color: white;
      border-radius: 12px;
      padding: 16px 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .game-card:hover {
      background: #251d30;
      border-color: #61477c;
    }

    .credit {
      margin-top: 35px;
      color: #716a78;
      font-size: 13px;
    }

    /* Browser */

    #browser {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }

    #browser.active {
      display: block;
    }

    .proxy-frame,
    .youtube-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    /* Home button */

    #homeButton {
      position: absolute;
      z-index: 100;
      left: 12px;
      top: 12px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: rgba(25, 20, 32, 0.92);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: none;
    }

    #homeButton.visible {
      display: block;
    }

    #homeButton:hover {
      background: #49355b;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 34px;
      }

      .search-box {
        flex-direction: column;
      }

      #proxyForm button {
        width: 100%;
      }

      .tab {
        min-width: 125px;
      }
    }
  </style>

  <script src="/scramjet/scramjet.js"></script>
  <script src="/controller/controller.api.js"></script>
  <script src="/utils/scramjet-utils.js"></script>
</head>

<body>

  <!-- Browser tabs -->

  <div id="tabBar">

    <div id="tabs"></div>

    <button
      id="newTabButton"
      type="button"
      title="New tab"
    >
      +
    </button>

  </div>

  <div id="main">

    <!-- Home screen -->

    <section id="shell">

      <div class="home">

        <div class="logo">
          Forknut
        </div>

        <div class="subtitle">
          Forknut Proxy
        </div>

        <form
          id="proxyForm"
          class="search-box"
        >
          <input
            id="url"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Enter a website or search"
          >

          <button type="submit">
            Go
          </button>
        </form>

        <div id="status">
          Ready
        </div>

        <div class="side-buttons">

          <button
            class="side-button"
            id="gamesButton"
            type="button"
          >
            🎮 Games
          </button>

          <button
            class="side-button"
            id="pointercrateButton"
            type="button"
          >
            Geometry Dash Demonlist
          </button>

        </div>

        <div id="gamesSection">

          <div class="section-title">
            Games
          </div>

          <div class="games">

            <button
              class="game-card"
              data-game="https://slopegame.io/"
            >
              Slope
            </button>

            <button
              class="game-card"
              data-game="https://play2048.co/"
            >
              2048
            </button>

            <button
              class="game-card"
              data-game="https://orteil.dashnet.org/cookieclicker/"
            >
              Cookie Clicker
            </button>

            <button
              class="game-card"
              data-game="https://tetris.com/play-tetris"
            >
              Tetris
            </button>

            <button
              class="game-card"
              data-game="https://www.coolmathgames.com/0-run-3"
            >
              Run 3
            </button>

            <button
              class="game-card"
              data-game="https://www.crazygames.com/game/geometry-dash"
            >
              Geometry Dash
            </button>

            <button
              class="game-card"
              data-game="https://www.drifthunters2.com/"
            >
              Drift Hunters
            </button>

            <button
              class="game-card"
              data-game="https://motox3m.io/"
            >
              Moto X3M
            </button>

            <button
              class="game-card"
              data-game="https://www.coolmathgames.com/0-stickman-hook"
            >
              Stickman Hook
            </button>

            <button
              class="game-card"
              data-game="https://snowrider3d.com/"
            >
              Snow Rider 3D
            </button>

            <button
              class="game-card"
              data-game="https://www.crazygames.com/game/basketball-stars"
            >
              Basketball Stars
            </button>

            <button
              class="game-card"
              data-game="https://flappybird.io/"
            >
              Flappy Bird
            </button>

          </div>

        </div>

        <div class="credit">
          Made by Archie Faulkner
        </div>

      </div>

    </section>

    <!-- Proxy browser -->

    <section id="browser">

      <button
        id="homeButton"
        type="button"
        title="Home"
      >
        🏠
      </button>

    </section>

  </div>

  <script src="/app.js"></script>

</body>
</html>
