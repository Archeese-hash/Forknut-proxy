<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Forknut Proxy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f8ff;overflow:hidden}
body{min-height:100%;display:grid;place-items:center}
.wrap{width:min(760px,92vw);text-align:center;position:relative;z-index:2}
.logo{font-size:20px;font-weight:800;letter-spacing:.5px;margin-bottom:55px}.logo span{display:inline-block;background:#6d5dfc;padding:8px 10px;border-radius:10px;margin-right:8px}
h1{font-size:clamp(38px,7vw,68px);margin:0 0 16px;line-height:1.02}
p{color:#aeb6cf;font-size:18px;margin:0 auto 34px;max-width:600px}
form{display:flex;background:#151c31;border:1px solid #2b3552;border-radius:16px;padding:7px;box-shadow:0 18px 60px #0006}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:15px}
button{border:0;border-radius:11px;padding:13px 24px;background:#6d5dfc;color:white;font-weight:750;font-size:15px;cursor:pointer}
button:hover{filter:brightness(1.08)}
.note{font-size:13px;color:#77819d;margin-top:18px}.note strong{display:block;font-size:20px;color:#aeb6cf;margin-bottom:6px}
#status{font-size:13px;color:#77819d;margin-top:14px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#browser{display:none;position:fixed;inset:0;background:#fff;z-index:5}
#browser.active{display:block}
.proxy-frame{display:block;width:100%;height:100%;border:0;background:#fff}
#homeButton{display:none;position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:10;border:0;background:#151c31;color:#fff;border:1px solid #2b3552;border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:0 8px 30px #0006}
#homeButton.visible{display:block}
.hidden{visibility:hidden;pointer-events:none}
@media(max-width:560px){form{padding:6px}button{padding:12px 16px}input{font-size:15px}.logo{margin-bottom:40px}}
</style>
</head>
<body>
<main class="wrap" id="shell">
  <div class="logo"><span>✦</span>Forknut Proxy</div>
  <h1>Browse the web simply.</h1>
  <p>Enter a website address below.</p>
  <form id="proxyForm">
    <input id="url" type="text" placeholder="https://example.com" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <button type="submit">Go</button>
  </form>
  <div class="note"><strong>Made by Archie Faulkner</strong>Forknut Proxy</div>
  <div id="status" aria-live="polite">Ready</div>
</main>
<div id="browser" aria-label="Forknut Proxy browser"></div>
<button id="homeButton" type="button">← Home</button>

<!-- Scramjet 2.x runtime: core first, controller second, utils third. -->
<script src="/scramjet/scramjet.js"></script>
<script src="/controller/controller.api.js"></script>
<script src="/utils/scramjet-utils.js"></script>
<script src="/app.js"></script>
</body>
</html>
