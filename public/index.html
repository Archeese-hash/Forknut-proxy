<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">

  <title>Forknut Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Top browser bar */

    #topbar {
      flex-shrink: 0;
      width: 100%;
      background: #181818;
      border-bottom: 1px solid #333;
      padding:
        env(safe-area-inset-top)
        10px
        8px
        10px;
    }

    #title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 6px 0 9px;
    }

    #searchForm {
      display: flex;
      gap: 7px;
      width: 100%;
    }

    #urlInput {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #252525;
      color: white;
      padding: 0 13px;
      font-size: 16px;
      outline: none;
    }

    #urlInput:focus {
      border-color: #777;
    }

    #goButton {
      width: 58px;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-weight: bold;
      font-size: 16px;
    }

    #goButton:active {
      transform: scale(.97);
    }

    /* Quick buttons */

    #quickButtons {
      display: flex;
      gap: 7px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    #quickButtons::-webkit-scrollbar {
      display: none;
    }

    .quickButton {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 14px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #242424;
      color: white;
      font-size: 14px;
      white-space: nowrap;
    }

    .quickButton:active {
      background: #333;
    }

    /* Status */

    #status {
      flex-shrink: 0;
      min-height: 26px;
      padding: 5px 12px;
      background: #101010;
      color: #aaa;
      font-size: 12px;
      border-bottom: 1px solid #292929;
    }

    /* Tabs */

    #tabs {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 43px;
      padding: 5px 7px;
      background: #151515;
      border-bottom: 1px solid #333;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      max-width: 180px;
      height: 32px;
      padding: 0 9px;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      background: #242424;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
    }

    .tab.active {
      background: #333;
      color: white;
      border-color: #666;
    }

    .tabTitle {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .closeTab {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 16px;
      padding: 0;
      line-height: 1;
    }

    #newTabButton {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 20px;
    }

    /* Browser */

    #browser {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: white;
      overflow: hidden;
    }

    .browserFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: white;
      display: none;
    }

    .browserFrame.active {
      display: block;
    }

    /* Home page */

    .homeScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #292929 0, #151515 35%, #101010 70%);
      padding: 30px;
      text-align: center;
      overflow-y: auto;
    }

    .homeScreen.hidden {
      display: none;
    }

    .logo {
      font-size: 58px;
      margin-bottom: 5px;
    }

    .homeTitle {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .homeSubtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .homeButtons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      max-width: 500px;
    }

    .homeButton {
      min-width: 130px;
      padding: 13px 18px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
    }

    .homeButton:active {
      background: #333;
    }

    /* Games screen */

    #gamesScreen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #111;
      overflow-y: auto;
      padding: 18px;
    }

    #gamesScreen.visible {
      display: flex;
    }

    .gamesTitle {
      font-size: 27px;
      font-weight: bold;
      text-align: center;
      margin: 5px 0 4px;
    }

    .gamesSubtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .gamesGrid {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .gameCard {
      min-height: 145px;
      padding: 18px;
      border: 1px solid #3d3d3d;
      border-radius: 14px;
      background: #202020;
      color: white;
      text-align: left;
    }

    .gameEmoji {
      font-size: 38px;
      margin-bottom: 7px;
    }

    .gameName {
      font-size: 20px;
      font-weight: bold;
    }

    .gameDescription {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    .gamePlay {
      margin-top: 12px;
      padding: 9px 15px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #111;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .gamesGrid {
        grid-template-columns: 1fr;
      }
    }

    /* Game viewer */

    #gameViewer {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #111;
    }

    #gameViewer.visible {
      display: flex;
    }

    #gameViewerBar {
      flex-shrink: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    #backToGames {
      height: 33px;
      padding: 0 13px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #242424;
      color: white;
    }

    #gameViewerTitle {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #gameFrame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #111;
    }

    /* Small iPad adjustments */

    @media (max-height: 600px) {
      #title {
        margin: 3px 0 5px;
      }

      #quickButtons {
        margin-top: 5px;
      }

      #tabs {
        min-height: 39px;
      }

      .homeScreen {
        justify-content: flex-start;
        padding-top: 35px;
      }
    }
  </style>
</head>

<body>

  <div id="topbar">

    <div id="title">🥜 Forknut Proxy</div>

    <form id="searchForm">
      <input
        id="urlInput"
        type="text"
        inputmode="url"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="Enter a website or search..."
        aria-label="Website address"
      >

      <button id="goButton" type="submit">
        Go
      </button>
    </form>

    <div id="quickButtons">

      <button
        class="quickButton"
        id="homeButton"
        type="button">
        🏠 Home
      </button>

      <button
        class="quickButton"
        id="pointercrateButton"
        type="button"
        data-site="pointercrate">
        🎮 Pointercrate
      </button>

      <button
        class="quickButton"
        id="gamesButton"
        type="button"
        data-action="games">
        🕹️ Games
      </button>

      <button
        class="quickButton"
        type="button"
        onclick="document.getElementById('urlInput').focus()">
        🔎 Search
      </button>

    </div>
  </div>

  <div id="status">
    Ready
  </div>

  <div id="tabs">

    <button
      id="newTabButton"
      type="button"
      aria-label="New tab">
      +
    </button>

  </div>

  <main id="browser">

    <!-- Home screen -->

    <section
      id="homeScreen"
      class="homeScreen">

      <div class="logo">🥜</div>

      <div class="homeTitle">
        Forknut Proxy
      </div>

      <div class="homeSubtitle">
        Made by Archie Faulkner
      </div>

      <div class="homeButtons">

        <button
          class="homeButton"
          type="button"
          onclick="document.getElementById('urlInput').focus()">
          🔎 Browse
        </button>

        <button
          class="homeButton"
          type="button"
          onclick="document.getElementById('pointercrateButton').click()">
          🎮 Pointercrate
        </button>

        <button
          class="homeButton"
          type="button"
          onclick="document.getElementById('gamesButton').click()">
          🕹️ Games
        </button>

      </div>

    </section>

    <!-- Games -->

    <section id="gamesScreen">

      <div class="gamesTitle">
        🕹️ Forknut Games
      </div>

      <div class="gamesSubtitle">
        Choose a game to play
      </div>

      <div class="gamesGrid">

        <div class="gameCard">

          <div class="gameEmoji">
            🐍
          </div>

          <div class="gameName">
            Snake
          </div>

          <div class="gameDescription">
            Eat the food and don't hit yourself.
          </div>

          <button
            class="gamePlay"
            type="button"
            data-game="snake">
            Play
          </button>

        </div>

        <div class="gameCard">

          <div class="gameEmoji">
            🔢
          </div>

          <div class="gameName">
            2048
          </div>

          <div class="gameDescription">
            Combine matching numbers to reach 2048.
          </div>

          <button
            class="gamePlay"
            type="button"
            data-game="2048">
            Play
          </button>

        </div>

        <div class="gameCard">

          <div class="gameEmoji">
            🐦
          </div>

          <div class="gameName">
            Flappy Fork
          </div>

          <div class="gameDescription">
            Fly through the pipes without crashing.
          </div>

          <button
            class="gamePlay"
            type="button"
            data-game="flappy">
            Play
          </button>

        </div>

        <div class="gameCard">

          <div class="gameEmoji">
            🏓
          </div>

          <div class="gameName">
            Pong
          </div>

          <div class="gameDescription">
            Beat the computer in classic Pong.
          </div>

          <button
            class="gamePlay"
            type="button"
            data-game="pong">
            Play
          </button>

        </div>

      </div>

    </section>

    <!-- Individual game -->

    <section id="gameViewer">

      <div id="gameViewerBar">

        <button
          id="backToGames"
          type="button">
          ← Games
        </button>

        <div id="gameViewerTitle">
          Game
        </div>

      </div>

      <iframe
        id="gameFrame"
        title="Forknut Game"
        allow="fullscreen; autoplay"
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
      ></iframe>

    </section>

  </main>

  <script>
    /*
      Forknut v12 UI

      Games:
        /games/snake.html
        /games/2048.html
        /games/flappy.html
        /games/pong.html
    */

    const gamesScreen =
      document.getElementById("gamesScreen");

    const gameViewer =
      document.getElementById("gameViewer");

    const gameFrame =
      document.getElementById("gameFrame");

    const gameViewerTitle =
      document.getElementById("gameViewerTitle");

    const backToGames =
      document.getElementById("backToGames");

    const browser =
      document.getElementById("browser");

    const homeScreen =
      document.getElementById("homeScreen");

    const status =
      document.getElementById("status");

    const urlInput =
      document.getElementById("urlInput");

    const gamesButton =
      document.getElementById("gamesButton");

    const homeButton =
      document.getElementById("homeButton");

    const pointercrateButton =
      document.getElementById("pointercrateButton");

    function setLocalStatus(text) {
      if (status) {
        status.textContent = text;
      }
    }

    function hideSpecialScreens() {
      gamesScreen.classList.remove("visible");
      gameViewer.classList.remove("visible");
      homeScreen.classList.add("hidden");
    }

    function showHome() {
      gamesScreen.classList.remove("visible");
      gameViewer.classList.remove("visible");

      document
        .querySelectorAll(".browserFrame")
        .forEach(frame => {
          frame.classList.remove("active");
        });

      homeScreen.classList.remove("hidden");

      setLocalStatus("Home");

      if (typeof window.setActiveTab === "function") {
        window.setActiveTab(null);
      }
    }

    function showGames() {
      gamesScreen.classList.add("visible");
      gameViewer.classList.remove("visible");
      homeScreen.classList.add("hidden");

      document
        .querySelectorAll(".browserFrame")
        .forEach(frame => {
          frame.classList.remove("active");
        });

      setLocalStatus("Games");

      if (typeof window.setActiveTab === "function") {
        window.setActiveTab(null);
      }
    }

    function openGame(game) {

      const files = {
        snake: {
          file: "snake.html",
          title: "🐍 Snake"
        },

        "2048": {
          file: "2048.html",
          title: "🔢 2048"
        },

        flappy: {
          file: "flappy.html",
          title: "🐦 Flappy Fork"
        },

        pong: {
          file: "pong.html",
          title: "🏓 Pong"
        }
      };

      const selected = files[game];

      if (!selected) {
        setLocalStatus("Game not found");
        return;
      }

      gamesScreen.classList.remove("visible");
      homeScreen.classList.add("hidden");
      gameViewer.classList.add("visible");

      gameViewerTitle.textContent =
        selected.title;

      gameFrame.src =
        "/games/" + selected.file;

      setLocalStatus(
        "Playing " + selected.title
      );
    }

    document
      .querySelectorAll(".gamePlay")
      .forEach(button => {

        button.addEventListener("click", () => {
          openGame(button.dataset.game);
        });

      });

    backToGames.addEventListener("click", () => {
      gameFrame.src = "";
      gameViewer.classList.remove("visible");
      gamesScreen.classList.add("visible");
      homeScreen.classList.add("hidden");

      setLocalStatus("Games");
    });

    gamesButton.addEventListener("click", () => {
      showGames();
    });

    homeButton.addEventListener("click", () => {
      showHome();
    });

    /*
      Pointercrate button.

      The normal app.js handles browsing.
      This simply sends the address to the
      existing URL system if available.
    */

    pointercrateButton.addEventListener("click", () => {

      const pointercrateURL =
        "https://pointercrate.com/demonlist/";

      if (typeof window.browse === "function") {
        window.browse(pointercrateURL);
        return;
      }

      if (urlInput) {
        urlInput.value =
          pointercrateURL;

        const form =
          document.getElementById("searchForm");

        if (form) {
          form.requestSubmit();
        }
      }

    });

    /*
      Make the Games screen available to
      app.js if it wants to call it.
    */

    window.showForknutGames = showGames;
    window.openForknutGame = openGame;
    window.showForknutHome = showHome;

    /*
      Prevent the browser from interpreting
      game buttons as form submissions.
    */

    document
      .querySelectorAll("button")
      .forEach(button => {

        if (!button.type) {
          button.type = "button";
        }

      });

    /*
      Keep the URL box usable on iPad.
    */

    if (urlInput) {

      urlInput.addEventListener("focus", () => {
        setLocalStatus("Enter a website or search");
      });

      urlInput.addEventListener("keydown", event => {

        if (event.key === "Escape") {
          urlInput.blur();
        }

      });

    }

  </script>

</body>
</html>
