<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forknut Snake</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    h1 {
        margin: 15px 0 5px;
    }

    #score {
        font-size: 20px;
        margin-bottom: 10px;
    }

    canvas {
        background: #222;
        border: 3px solid #fff;
        max-width: 90vw;
        max-height: 65vh;
        width: 400px;
        height: 400px;
        touch-action: none;
    }

    .controls {
        margin-top: 15px;
    }

    button {
        font-size: 22px;
        padding: 12px 20px;
        margin: 4px;
        border: 0;
        border-radius: 10px;
        background: #333;
        color: white;
    }

    #restart {
        font-size: 18px;
    }
</style>
</head>

<body>

<h1>🐍 Snake</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
    <div>
        <button onclick="changeDirection('up')">⬆️</button>
    </div>
    <div>
        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>

    <button id="restart" onclick="restart()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;
const cells = 20;

let snake;
let food;
let direction;
let nextDirection;
let score;
let gameOver;
let timer;

function restart() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "right";
    nextDirection = "right";
    score = 0;
    gameOver = false;

    placeFood();

    document.getElementById("score").textContent = "Score: 0";

    clearInterval(timer);
    timer = setInterval(gameLoop, 120);

    draw();
}

function placeFood() {
    do {
        food = {
            x: Math.floor(Math.random() * cells),
            y: Math.floor(Math.random() * cells)
        };
    } while (
        snake.some(part => part.x === food.x && part.y === food.y)
    );
}

function changeDirection(newDirection) {
    if (
        (direction === "up" && newDirection === "down") ||
        (direction === "down" && newDirection === "up") ||
        (direction === "left" && newDirection === "right") ||
        (direction === "right" && newDirection === "left")
    ) {
        return;
    }

    nextDirection = newDirection;
}

document.addEventListener("keydown", event => {
    if (event.key === "ArrowUp") changeDirection("up");
    if (event.key === "ArrowDown") changeDirection("down");
    if (event.key === "ArrowLeft") changeDirection("left");
    if (event.key === "ArrowRight") changeDirection("right");
});

function gameLoop() {
    if (gameOver) return;

    direction = nextDirection;

    const head = {...snake[0]};

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;

    if (
        head.x < 0 ||
        head.x >= cells ||
        head.y < 0 ||
        head.y >= cells ||
        snake.some(part => part.x === head.x && part.y === head.y)
    ) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent =
            "Score: " + score;
        placeFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#4caf50";

    snake.forEach(part => {
        ctx.fillRect(
            part.x * size,
            part.y * size,
            size - 1,
            size - 1
        );
    });

    ctx.fillStyle = "#f44336";

    ctx.fillRect(
        food.x * size,
        food.y * size,
        size - 1,
        size - 1
    );
}

function endGame() {
    gameOver = true;
    clearInterval(timer);

    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "32px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Game Over!",
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.font = "20px Arial";

    ctx.fillText(
        "Score: " + score,
        canvas.width / 2,
        canvas.height / 2 + 35
    );
}

restart();
</script>

</body>
</html>
