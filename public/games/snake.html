<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forknut Pong</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
h1{margin:15px 0 5px}
#score{font-size:20px;margin:8px}
canvas{background:#000;border:3px solid white;max-width:94vw;width:500px;height:350px;touch-action:none}
button{padding:12px 22px;margin:12px;font-size:18px;border:0;border-radius:10px}
</style>
</head>
<body>

<h1>🏓 Forknut Pong</h1>
<div id="score">You: 0 | CPU: 0</div>
<canvas id="game" width="500" height="350"></canvas>
<br>
<button onclick="restart()">Restart</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player,cpu,ball,playerScore,cpuScore,timer;

function restart(){
 player={x:15,y:140,w:12,h:70};
 cpu={x:473,y:140,w:12,h:70};
 ball={x:250,y:175,vx:4,vy:3};
 playerScore=0;
 cpuScore=0;
 clearInterval(timer);
 timer=setInterval(loop,20);
 draw();
 updateScore();
}

function updateScore(){
 document.getElementById("score").textContent=
 "You: "+playerScore+" | CPU: "+cpuScore;
}

function movePlayer(y){
 player.y=y-player.h/2;
 if(player.y<0)player.y=0;
 if(player.y>canvas.height-player.h)
   player.y=canvas.height-player.h;
}

canvas.addEventListener("touchmove",e=>{
 e.preventDefault();
 const rect=canvas.getBoundingClientRect();
 const y=(e.touches[0].clientY-rect.top)*(canvas.height/rect.height);
 movePlayer(y);
});

canvas.addEventListener("mousemove",e=>{
 const rect=canvas.getBoundingClientRect();
 const y=(e.clientY-rect.top)*(canvas.height/rect.height);
 movePlayer(y);
});

function resetBall(){
 ball.x=250;
 ball.y=175;
 ball.vx=ball.vx>0?-4:4;
 ball.vy=(Math.random()*4)-2;
}

function loop(){
 ball.x+=ball.vx;
 ball.y+=ball.vy;

 if(ball.y<0||ball.y>canvas.height){
   ball.vy*=-1;
 }

 cpu.y+=(ball.y-(cpu.y+cpu.h/2))*0.07;

 if(
   ball.x<player.x+player.w &&
   ball.x>player.x &&
   ball.y>player.y &&
   ball.y<player.y+player.h
 ){
   ball.vx=Math.abs(ball.vx);
 }

 if(
   ball.x>cpu.x &&
   ball.x<cpu.x+cpu.w &&
   ball.y>cpu.y &&
   ball.y<cpu.y+cpu.h
 ){
   ball.vx=-Math.abs(ball.vx);
 }

 if(ball.x<0){
   cpuScore++;
   updateScore();
   resetBall();
 }

 if(ball.x>canvas.width){
   playerScore++;
   updateScore();
   resetBall();
 }

 draw();
}

function draw(){
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,500,350);

 ctx.strokeStyle="#555";
 ctx.setLineDash([8,8]);
 ctx.beginPath();
 ctx.moveTo(250,0);
 ctx.lineTo(250,350);
 ctx.stroke();
 ctx.setLineDash([]);

 ctx.fillStyle="white";
 ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.fillRect(cpu.x,cpu.y,cpu.w,cpu.h);

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
 ctx.fill();
}

restart();
</script>
</body>
</html>
